name: Export check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy
      # Retired colours in any file, and the 2020 badge in any committed image.
      - run: python scripts/check-brand.py
      # Every badge file must still be what tokens.json builds.
      - run: python scripts/build-logo-assets.py --verify
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run export
      # Every template export, rendered fresh, must carry the current badge.
      - run: python scripts/check-brand.py exports/
