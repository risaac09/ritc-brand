<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RITC workout announcement, 1080x1350</title>
<link rel="stylesheet" href="../brand/tokens.css">
</head>
<body>

<!-- ========================================================================
     EDIT HERE. Copy only. Do not touch the layout below.
     Anything in {{DOUBLE_BRACES}} is a placeholder for you to fill in.
     ===================================================================== -->
<script>
const POST = {
  // 'a' = Sand frame over Navy field. 'b' = Ebony frame over Baby Ocean Blue.
  layer: 'a',

  eyebrow: 'Tuesday Workout',
  title: '{{WORKOUT_NAME}}',

  // Two to four rows. Fewer reads better than more.
  details: [
    { label: 'When',  value: '{{DAY}}, {{TIME}}' },
    { label: 'Where', value: '{{LOCATION}}' },
    { label: 'The session', value: '{{WORKOUT_DETAIL}}' },
  ],

  // One short line. Leave empty to hide it.
  note: '{{ONE_LINE_NOTE}}',

  // Path or URL. Leave empty for a solid field with no photograph.
  photo: '',
  photoAlt: '',

  handle: '@rhodeislandtrackclub',
};
</script>
<!-- ===================== END OF EDITABLE COPY ========================== -->

<div class="ritc-canvas ritc-canvas--portrait" id="canvas">
  <div class="ritc-frame ritc-frame--full">

    <div class="ritc-field">
      <div class="ritc-photo" id="photo" hidden>
        <img id="photoImg" alt="">
      </div>

      <div class="wa-stars" data-ritc-star-column="30"></div>

      <div class="wa-copy">
        <p class="ritc-eyebrow" id="eyebrow"></p>
        <h1 class="ritc-display wa-title" id="title"></h1>
        <dl class="wa-details" id="details"></dl>
        <p class="ritc-caption wa-note" id="note" hidden></p>
      </div>
    </div>

    <div class="ritc-waist">
      <div data-ritc-badge="136"></div>
      <div class="wa-waist-text">
        <p class="ritc-h3 wa-clubname">Rhode Island<br>Track Club</p>
        <p class="ritc-caption wa-handle" id="handle"></p>
      </div>
    </div>

  </div>
</div>

<style>
  body { margin: 0; background: var(--preview-bg); }

  /* Star column: inner layer, hard against the field's left edge. */
  .wa-stars {
    position: absolute;
    left: var(--sp-md);
    top: var(--sp-md);
    bottom: var(--sp-md);
    width: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    color: var(--text-on-dark-muted);
    opacity: 0.85;
  }

  .wa-copy {
    position: absolute;
    left: calc(var(--sp-md) + 30px + var(--sp-lg));
    right: var(--sp-lg);
    bottom: var(--sp-lg);
  }

  .wa-title { margin-top: var(--sp-sm); }

  .wa-details {
    margin: var(--sp-lg) 0 0;
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: var(--sp-md);
    row-gap: var(--sp-sm);
    align-items: baseline;
  }
  .wa-details dt {
    font-family: var(--font-display);
    font-size: var(--fs-eyebrow);
    line-height: var(--lh-body-lg);
    letter-spacing: var(--tr-eyebrow);
    font-weight: var(--fw-medium);
    text-transform: uppercase;
    color: var(--text-on-dark-muted);
    white-space: nowrap;
  }
  .wa-details dd {
    margin: 0;
    font-size: var(--fs-body-lg);
    line-height: var(--lh-body-lg);
  }

  .wa-note {
    margin-top: var(--sp-lg);
    padding-top: var(--sp-sm);
    border-top: var(--bd-hairline) solid var(--rule-color);
    color: var(--text-on-dark-muted);
  }

  .wa-waist-text { display: flex; flex-direction: column; gap: 4px; }
  .wa-clubname { letter-spacing: 0.01em; }
  .wa-handle { opacity: 0.75; }
</style>

<script src="../brand/marks.js"></script>
<script>
  (function render() {
    const canvas = document.getElementById('canvas');
    if (POST.layer === 'b') canvas.classList.add('ritc-layer-b');

    document.getElementById('eyebrow').textContent = POST.eyebrow;
    document.getElementById('title').textContent = POST.title;
    document.getElementById('handle').textContent = POST.handle;

    const dl = document.getElementById('details');
    POST.details.forEach(({ label, value }) => {
      const dt = document.createElement('dt');
      dt.textContent = label;
      const dd = document.createElement('dd');
      dd.textContent = value;
      dl.append(dt, dd);
    });

    if (POST.note) {
      const note = document.getElementById('note');
      note.textContent = POST.note;
      note.hidden = false;
    }

    if (POST.photo) {
      const slot = document.getElementById('photo');
      const img = document.getElementById('photoImg');
      img.src = POST.photo;
      img.alt = POST.photoAlt || '';
      slot.hidden = false;
    }

    const titleEl = document.getElementById('title');
    ritcAllowBreak(titleEl);
    ritcFitText(titleEl, { maxLines: 3, min: 48 });

    ritcPaintMarks();
    document.fonts.ready.then(() => document.documentElement.setAttribute('data-ritc-ready', '1'));
  })();
</script>

</body>
</html>
