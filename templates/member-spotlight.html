<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RITC member spotlight, 1080x1350</title>
<link rel="stylesheet" href="../brand/tokens.css">
</head>
<body>

<!-- ========================================================================
     EDIT HERE. Copy only. Do not touch the layout below.
     Anything in {{DOUBLE_BRACES}} is a placeholder for you to fill in.
     ===================================================================== -->
<script>
const POST = {
  // 'a' = Sand hem bands, Navy field, white text.
  // 'b' = Ebony hem bands, Baby Ocean Blue field, navy text.
  layer: 'a',

  eyebrow: 'Member Spotlight',
  name: '{{MEMBER_NAME}}',

  // The member's own words. This is the point of the template; write it as
  // a quote, not a bio blurb.
  quote: '{{MEMBER_QUOTE}}',

  // Zero, one, or two facts. Leave the array empty to omit the row
  // entirely. A third row will fit but starts to compete with the quote.
  stats: [
    { label: '{{STAT_LABEL}}', value: '{{STAT_VALUE}}' },
  ],

  // Path or URL. Leave empty for a solid field with no photograph, though
  // this template is built to carry one.
  photo: '',
  photoAlt: '',
  // 'vertical' keeps the top of the photo clear. 'full' darkens evenly.
  scrim: 'vertical',

  handle: '@rhodeislandtrackclub',
};
</script>
<!-- ===================== END OF EDITABLE COPY ========================== -->

<div class="ritc-canvas ritc-canvas--portrait" id="canvas">
  <div class="ritc-frame ritc-frame--hem" id="frame">
    <div class="ritc-field" id="field">

      <div class="ritc-photo" id="photo" hidden>
        <img id="photoImg" alt="">
      </div>

      <div class="ms-stars-bar"></div>
      <div class="ms-stars ritc-star-column" data-ritc-star-column="30"></div>

      <div class="ms-copy">
        <p class="ritc-eyebrow" id="eyebrow"></p>
        <h1 class="ritc-display ms-name" id="name"></h1>
        <p class="ritc-body-lg ms-quote" id="quote"></p>
        <div class="ms-stats" id="stats"></div>
      </div>

      <div class="ms-footer">
        <div data-ritc-badge="84"></div>
        <p class="ritc-caption ms-handle" id="handle"></p>
      </div>

    </div>
    <!-- Hem bands are structural, not content. Sand or Ebony, no text, no
         badge: the frame is chrome, the field carries everything. -->
  </div>
</div>

<style>
  body { margin: 0; background: var(--preview-bg); }

  .ms-stars-bar {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: calc(var(--sp-md) + 30px + var(--sp-sm));
    background: var(--edge-tint-fade);
    pointer-events: none;
  }
  .ms-stars {
    position: absolute;
    left: var(--sp-md);
    top: var(--sp-md);
    bottom: var(--sp-md);
    width: 30px;
    justify-content: space-between;
    opacity: 0.85;
  }

  .ms-copy {
    position: absolute;
    left: calc(var(--sp-md) + 30px + var(--sp-lg));
    right: var(--sp-lg);
    bottom: 156px; /* clears the footer row */
  }

  .ms-name { margin-top: var(--sp-sm); }

  .ms-quote {
    position: relative;
    margin-top: var(--sp-lg);
    padding-left: var(--sp-lg);
  }
  .ms-quote::before {
    content: '\201C';
    position: absolute;
    left: 0;
    top: -0.28em;
    font-family: var(--font-display);
    font-size: 2.6em;
    line-height: 1;
    color: var(--rule-color);
  }

  .ms-stats {
    margin-top: var(--sp-lg);
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: var(--sp-md);
    row-gap: var(--sp-sm);
    align-items: baseline;
  }
  .ms-stats dt {
    font-family: var(--font-display);
    font-size: var(--fs-eyebrow);
    line-height: var(--lh-body-lg);
    letter-spacing: var(--tr-eyebrow);
    font-weight: var(--fw-medium);
    text-transform: uppercase;
    color: var(--field-fg-muted);
    white-space: nowrap;
  }
  .ms-stats dd {
    margin: 0;
    font-size: var(--fs-body-lg);
    line-height: var(--lh-body-lg);
  }

  .ms-footer {
    position: absolute;
    left: calc(var(--sp-md) + 30px + var(--sp-lg));
    right: var(--sp-lg);
    bottom: var(--sp-lg);
    display: flex;
    align-items: center;
    gap: var(--sp-md);
  }
  .ms-handle { opacity: 0.85; margin: 0; }
</style>

<script src="../brand/marks.js"></script>
<script>
  (function render() {
    const canvas = document.getElementById('canvas');
    if (POST.layer === 'b') canvas.classList.add('ritc-layer-b');

    document.getElementById('eyebrow').textContent = POST.eyebrow;
    document.getElementById('handle').textContent = POST.handle;
    document.getElementById('quote').textContent = POST.quote;

    const nameEl = document.getElementById('name');
    nameEl.textContent = POST.name;

    const stats = document.getElementById('stats');
    (POST.stats || []).forEach(({ label, value }) => {
      const dt = document.createElement('dt');
      dt.textContent = label;
      const dd = document.createElement('dd');
      dd.textContent = value;
      stats.append(dt, dd);
    });

    if (POST.photo) {
      const slot = document.getElementById('photo');
      const img = document.getElementById('photoImg');
      img.src = POST.photo;
      img.alt = POST.photoAlt || '';
      slot.hidden = false;
      // The scrim is navy whatever the layer, so the copy over it uses the
      // on-navy foreground set. See .ritc-on-photo in tokens.css.
      slot.closest('.ritc-field').classList.add('ritc-on-photo');
      if (POST.scrim === 'full') slot.classList.add('ritc-photo--full');
    }

    ritcAllowBreak(nameEl);
    ritcFitText(nameEl, { maxLines: 2, min: 48 });

    ritcPaintMarks();
    document.fonts.ready.then(() => document.documentElement.setAttribute('data-ritc-ready', '1'));
  })();
</script>

</body>
</html>
